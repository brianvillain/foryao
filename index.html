
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Yao</title>

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/256/4289/4289411.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans&display=swap" rel="stylesheet">

  <style>
    .content-box ul {
      margin-top: 10px;
      margin-bottom: 25px;
      padding-left: 20px;
    }

    .content-box ul li {
      margin-bottom: 10px;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .content-box ul li:hover {
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      cursor: default;
    }

    .heart-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      width: 24px;
      height: 24px;
      background-image: url('https://i1.sndcdn.com/artworks-IVkSBFRycvriGuID-Qujzag-t1080x1080.jpg');
      background-repeat: no-repeat;
      background-size: contain;
      animation: float 10s linear infinite;
      opacity: 0.7;
    }

    .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 30%; animation-delay: 2s; }
    .heart:nth-child(3) { left: 50%; animation-delay: 4s; }
    .heart:nth-child(4) { left: 70%; animation-delay: 6s; }
    .heart:nth-child(5) { left: 90%; animation-delay: 8s; }

    @keyframes float {
      0% {
        top: -10%;
        transform: translateX(0) rotate(0deg);
        opacity: 0.8;
      }
      50% {
        transform: translateX(20px) rotate(180deg);
      }
      100% {
        top: 110%;
        transform: translateX(-20px) rotate(360deg);
        opacity: 0;
      }
    }

    .content-box {
      position: relative;
      z-index: 2;
    }
    .button-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 25px;
}


.gift-button {
  display: inline-block;
  background: linear-gradient(135deg, #ff66cc, #ff99cc, #ffd6e7);
  color: white;
  font-weight: bold;
  padding: 14px 28px;
  font-size: 1.1rem;
  border: none;
  border-radius: 50px;
  text-decoration: none;
  box-shadow: 0 0 15px rgba(255, 153, 204, 0.6);
  transition: all 0.3s ease-in-out;
  position: relative;
}

.gift-button:hover {
  background: linear-gradient(135deg, #ff4da6, #ff85b3);
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(255, 153, 204, 0.9), 0 0 10px #fff;
  text-shadow: 0 0 5px #fff;
}
.page-content p span {
  transition: color 0.3s ease;
  cursor: pointer;
}

.page-content p span:hover {
  color: #ffcad4;
  text-shadow: 0 0 8px #ffcad4;
}

.page-content p:hover {
  text-shadow: 0 0 8px #ffffff;
  color: #fff;
  cursor: default;
}
.page-content li:hover {
  text-shadow: 0 0 8px #ffffff;
  color: #fff;
  cursor: default;
}
    .page h1:hover {
  text-shadow: 0 0 10px #ff8dd6, 0 0 20px #ff8dd6;
  cursor: default;
}
.cover-message {
  background-color: rgba(0, 0, 0, 0.4); /* soft dark overlay */
  padding: 20px 30px;
  border-radius: 20px;
  display: inline-block;
  backdrop-filter: blur(5px);
  box-shadow: 0 0 15px rgba(255, 192, 203, 0.3);
  transition: transform 0.3s ease;
}

.cover-message:hover {
  transform: scale(1.02);
  box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
}

.cover-message h1,
.cover-message p {
  color: #fff;
  text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
}

.note-button {
  margin-top: 40px;
}

#open-book-btn {
  background: #fff;
  color: #ff69b4;
  font-weight: bold;
  font-family: 'Open Sans', sans-serif;
  border: 2px solid #ff99cc;
  border-radius: 20px;
  padding: 14px 28px;
  font-size: 1.1rem;
  box-shadow: 0 0 12px rgba(255, 153, 204, 0.4);
  transition: all 0.3s ease-in-out;
}

#open-book-btn:hover {
  background: #ffe6f0;
  box-shadow: 0 0 24px rgba(255, 153, 204, 0.8);
  transform: translateY(-2px);
  text-shadow: 0 0 5px #ffb6d9;
  cursor: pointer;
}
.cover-container {
  position: absolute;
  top: 55vh; /* Moved down to lower part of screen */
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 10;
}

  </style>
</head>

<body>
  <div class="heart-container">
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
  </div>

  <!-- Welcome Message + Cover -->
<div id="cover-screen">
  <div class="cover-container">
    <div class="cover-message">
      <h1>FYI, I loved you.</h1>
      <p>But you don't deserve it anymore.</p>
    </div>
  </div>
</div>

<div class="nav-buttons">
  <button id="prev-btn">← Back</button>
  <button id="next-btn">Next →</button>
</div>

  <!-- JS -->
  <script src="book.js"></script>
</body>
